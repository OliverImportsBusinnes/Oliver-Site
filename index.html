<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050807" />

    <title>Oliver Imports | Desenvolvimento de Software e Soluções Digitais</title>
    <meta
      name="description"
      content="Oliver Imports desenvolve sistemas, sites, automações e soluções digitais sob medida para empresas."
    />
    <meta name="author" content="Oliver Imports" />

    <!-- Ícones -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!--
      `__SITE_URL__` é trocado no build pelo valor de VITE_SITE_URL (ver
      vite.config.js). Não edite a URL aqui: ao ligar um domínio próprio, basta
      mudar a variável no Render e refazer o deploy.
    -->
    <link rel="canonical" href="__SITE_URL__/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Oliver Imports" />
    <meta
      property="og:title"
      content="Oliver Imports | Desenvolvimento de Software e Soluções Digitais"
    />
    <meta
      property="og:description"
      content="Oliver Imports desenvolve sistemas, sites, automações e soluções digitais sob medida para empresas."
    />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Oliver Imports" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Oliver Imports | Desenvolvimento de Software e Soluções Digitais"
    />
    <meta
      name="twitter:description"
      content="Oliver Imports desenvolve sistemas, sites, automações e soluções digitais sob medida para empresas."
    />
    <meta name="twitter:image" content="__SITE_URL__/og-image.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
